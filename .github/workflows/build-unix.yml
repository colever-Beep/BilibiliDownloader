name: Build Linux/macOS packages

# 手动触发（Actions 页面 Run workflow）或推送 v* tag 时构建：
#   - Linux: AppImage（单文件，赋予执行权限即可运行）
#   - macOS: ad-hoc 签名 .app 的 .dmg / .app.zip
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  appimage:
    name: AppImage (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install build & runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Build AppImage
        run: python build_linux_appimage.py
      - uses: actions/upload-artifact@v4
        with:
          name: BilibiliDownloader-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  dmg:
    name: DMG (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install build & runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Build DMG
        run: python build_macos_dmg.py
      - uses: actions/upload-artifact@v4
        with:
          name: BilibiliDownloader-macOS
          path: |
            dist/*.dmg
            dist/*.app.zip
          if-no-files-found: error
