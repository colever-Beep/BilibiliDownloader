name: Build packages

# ============================================================================
# 发布流程（完整说明见 docs/beta-release-flow.md）
#
#   1) 推送 v* tag              -> 正式版 Release（tag 即版本号，如 v2.2.0）
#   2) 提交信息含 [beta] / beta: -> Beta 预发布（tag 为 v<版本号>-beta，滚动覆盖，
#                                  只保留最新一个 beta Release；正式版 tag 不受影响）
#   3) 手动 Run workflow        -> continuous 滚动预发布（tag 固定 continuous）
#   4) 普通 main 提交（无标记）  -> 跳过构建，不浪费 Actions 额度
#
# 所有模式由 prepare job 统一判定，下游构建/发布 job 直接复用其 outputs，
# 避免各处重复解析 ref 与 commit message。
#
# 发行说明：正式版读 release_notes/<tag>.md；beta 读 release_notes/beta.md；
#           continuous 读 release_notes/continuous.md（均可缺省）。
# ============================================================================
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  # --------------------------------------------------------------------------
  # 模式判定：输出 should_build 控制下游是否构建，其余输出供版本号 / Release 使用。
  # 所有输出一律非空，杜绝 set -u 下的 unbound variable。
  # --------------------------------------------------------------------------
  prepare:
    name: 判定发布模式
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      should_build: ${{ steps.detect.outputs.should_build }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      title: ${{ steps.detect.outputs.title }}
      prerelease: ${{ steps.detect.outputs.prerelease }}
      notes: ${{ steps.detect.outputs.notes }}
      sha: ${{ steps.detect.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Detect release mode
        id: detect
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          REF="${GITHUB_REF}"
          EVENT="${GITHUB_EVENT_NAME}"
          MSG="${COMMIT_MESSAGE:-}"
          SHORT="${GITHUB_SHA:0:7}"
          emit sha "$SHORT"

          if [[ "$REF" == refs/tags/v* ]]; then
            # ---- 正式版：tag push ----
            TAG="${GITHUB_REF_NAME}"
            emit mode stable
            emit should_build true
            emit version "${TAG#v}"
            emit tag "$TAG"
            emit prerelease false
            emit title "BilibiliDownloader ${TAG}"
            emit notes "release_notes/${TAG}.md"
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            # ---- 手动触发：continuous 滚动预发布 ----
            emit mode continuous
            emit should_build true
            emit version continuous
            emit tag continuous
            emit prerelease true
            emit title "BilibiliDownloader 持续构建 ($(date +%Y-%m-%d))"
            emit notes "release_notes/continuous.md"
          elif [[ "$MSG" =~ \[beta([^]]*)\] ]] || [[ "$MSG" =~ (^|[[:space:]])beta: ]]; then
            # ---- Beta：commit message 标记触发 ----
            # 版本号从提交信息里的三段式数字提取（如 "beta: 2.3.0 新增选集"）；
            # 没写版本号则回退读取 utils/version.py 的 APP_VERSION。
            VER=""
            if [[ "$MSG" =~ ([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              VER="${BASH_REMATCH[1]}"
            else
              VER=$(python -c 'import re,pathlib; print(re.search(r"APP_VERSION = \"([^\"]+)\"", pathlib.Path("utils/version.py").read_text(encoding="utf-8")).group(1))')
            fi
            emit mode beta
            emit should_build true
            emit version "$VER"
            emit tag "v${VER}-beta"
            emit prerelease true
            emit title "BilibiliDownloader ${VER} Beta (${SHORT})"
            emit notes "release_notes/beta.md"
          else
            # ---- 普通提交：跳过，所有输出给非空占位值 ----
            emit mode skip
            emit should_build false
            emit version skip
            emit tag skip
            emit prerelease false
            emit title skip
            emit notes skip.md
          fi

  # --------------------------------------------------------------------------
  # 各平台构建：仅在 should_build=true 时运行，版本号统一取 prepare 输出。
  # --------------------------------------------------------------------------
  appimage:
    name: AppImage (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install build & runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Build AppImage
        run: python build_linux_appimage.py
      - uses: actions/upload-artifact@v7
        with:
          name: BilibiliDownloader-AppImage-${{ matrix.arch }}
          path: dist/BilibiliDownloader-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  dmg:
    name: DMG (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            # macos-14 已于 2026-11-02 被 GitHub 下线（EOL），迁移到 macos-15（Apple Silicon arm64 镜像）
            runner: macos-15
          - arch: x86_64
            # macos-13 已于 2025-12 下线（GitHub 停止维护 Intel runner）；
            # 改用官方提供的最后一个 x86_64 镜像 macos-15-intel（预计可用至 2027-08）。
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install build & runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Build DMG
        run: python build_macos_dmg.py
      - uses: actions/upload-artifact@v7
        with:
          name: BilibiliDownloader-macOS-${{ matrix.arch }}
          path: |
            dist/BilibiliDownloader-macos-${{ matrix.arch }}.dmg
            dist/BilibiliDownloader-macos-${{ matrix.arch }}.app.zip
          if-no-files-found: error

  windows:
    name: Windows exe / portable
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install build & runtime deps
        # auto-py-to-exe 是 build_portable.py 的打包引擎；
        # win10toast 是 Windows 通知依赖（hidden-import，未进 requirements.txt，需单独装）。
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller auto-py-to-exe win10toast
          pip install -r requirements.txt
      # 直接下载官方 Inno Setup 6（版本锁定，避免 choco 默认装成 7.x 而落到
      # “Inno Setup 7” 目录，导致 build_installer.ps1 默认路径 C:\Program Files (x86)\Inno Setup 6 找不到 iscc）。
      # 静默安装到 Program Files (x86)\Inno Setup 6，并加入后续步骤的 PATH。
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (Test-Path $iscc) {
            Write-Host "Inno Setup 6 已存在，跳过安装: $iscc"
            exit 0
          }
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $installer = Join-Path $env:TEMP 'innosetup-6.7.3.exe'
          Write-Host "下载 Inno Setup 6.7.3: $url"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Write-Host "静默安装 Inno Setup 6 ..."
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/NORESTART','/ALLUSERS' -Wait
          if (-not (Test-Path $iscc)) {
            throw "安装后仍未找到 $iscc，Inno Setup 安装可能失败。"
          }
          # 将 ISCC 加入后续步骤的 PATH（与 build_installer.ps1 默认路径一致）
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
          Write-Host "Inno Setup 6 安装完成。"
      # 一键脚本：产出 onedir + 内置 ffmpeg，再编译出安装版 Setup.exe（取代原单文件 .exe）
      - name: Build installer (Setup.exe) with embedded ffmpeg
        run: .\installer\build_installer.ps1 -Version "$env:BD_VERSION"
        env:
          BD_VERSION: ${{ needs.prepare.outputs.version }}
      - name: Zip portable (with embedded ffmpeg)
        run: python -c "import shutil; shutil.make_archive('dist/BilibiliDownloader-portable', 'zip', 'dist', 'BilibiliDownloader')"
      - uses: actions/upload-artifact@v7
        with:
          name: BilibiliDownloader-Windows
          path: |
            dist/BilibiliDownloader-Setup-*.exe
            dist/BilibiliDownloader-portable.zip
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # 发布：收集全部产物 -> 生成正文 -> 创建/更新 Release。
  # beta 模式会先删除旧的 *-beta Release，始终只保留最新一个。
  # --------------------------------------------------------------------------
  release:
    name: Publish to GitHub Release
    needs: [prepare, appimage, dmg, windows]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo (for release notes)
        uses: actions/checkout@v6
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: List collected files
        run: ls -lh dist
      - name: Build release notes body
        id: body
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          NOTES: ${{ needs.prepare.outputs.notes }}
          MODE: ${{ needs.prepare.outputs.mode }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          NOTES_FILE="${NOTES:-}"
          body=$(mktemp)
          {
            if [[ -n "$NOTES_FILE" && -f "$NOTES_FILE" ]]; then
              echo "## 更新说明"
              echo
              cat "$NOTES_FILE"
              echo
              echo "---"
              echo
            fi
            echo "## 下载"
            echo
            echo "| 平台 | 架构 | 文件 | 说明 |"
            echo "| --- | --- | --- | --- |"
            echo "| Linux | x86_64 | \`BilibiliDownloader-x86_64.AppImage\` | 单文件，\`chmod +x\` 后运行 |"
            echo "| Linux | ARM64 | \`BilibiliDownloader-aarch64.AppImage\` | 树莓派 / ARM 设备，\`chmod +x\` 后运行 |"
            echo "| macOS | Apple Silicon | \`BilibiliDownloader-macos-arm64.dmg\` | 拖拽到「应用程序」安装 |"
            echo "| macOS | Apple Silicon | \`BilibiliDownloader-macos-arm64.app.zip\` | 已 ad-hoc 签名的 \`.app\` |"
            echo "| macOS | Intel | \`BilibiliDownloader-macos-x86_64.dmg\` | 拖拽到「应用程序」安装 |"
            echo "| macOS | Intel | \`BilibiliDownloader-macos-x86_64.app.zip\` | 已 ad-hoc 签名的 \`.app\` |"
            WIN_SETUP_FILE=$(ls dist/BilibiliDownloader-Setup-*.exe 2>/dev/null | head -1 | xargs -n1 basename)
            if [[ -z "$WIN_SETUP_FILE" ]]; then
              WIN_SETUP_FILE="BilibiliDownloader-Setup-${TAG#v}.exe"
            fi
            echo "| Windows | x86_64 | \`$WIN_SETUP_FILE\` | 安装版（向导安装，内置 ffmpeg，离线可用）|"
            echo "| Windows | x86_64 | \`BilibiliDownloader-portable.zip\` | 便携版（解压即用，无需安装） |"
            echo
            if [[ "${MODE:-}" == "beta" ]]; then
              echo "> 这是 **Beta 预发布版**，对应 commit \`${SHA}\`，可能不稳定；建议普通用户使用正式版。"
              echo
            elif [[ "${PRERELEASE:-false}" == "true" ]]; then
              echo "> 本发布为**持续构建（prerelease）**，对应最近一次手动触发的构建，可能不稳定。"
              echo
            fi
            echo "> **macOS 首次打开**：本包未做 Apple 公证，Gatekeeper 会拦截。"
            echo "> 请右键点击 App/DMG 选择「打开」，或在终端执行："
            echo "> \`xattr -d com.apple.quarantine /Applications/BilibiliDownloader.app\`"
            echo
            echo "> Windows 安装版 / 便携版均已**内置 FFmpeg**（无需联网即可下载视频）。"
            echo "> Linux AppImage / macOS 仍会在首次使用时自动按平台下载并缓存 FFmpeg。"
          } > "$body"
          echo "file=$body" >> "$GITHUB_OUTPUT"
      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TITLE: ${{ needs.prepare.outputs.title }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          MODE: ${{ needs.prepare.outputs.mode }}
          BODY_FILE: ${{ steps.body.outputs.file }}
        run: |
          set -euo pipefail
          # 用显式数组而非裸 $PRERELEASE：即使 env 缺失也不会 unbound，且避免词拆分。
          prerelease_flags=()
          if [[ "${PRERELEASE:-false}" == "true" ]]; then
            prerelease_flags=(--prerelease)
          fi

          # beta 滚动：删除除本次外的所有 *-beta Release 及其 tag，始终只留一个。
          if [[ "${MODE:-}" == "beta" ]]; then
            while IFS= read -r old; do
              [[ -n "$old" && "$old" == *-beta && "$old" != "$TAG" ]] || continue
              echo "清理旧 Beta Release: $old"
              gh release delete "$old" --repo "$REPO" --yes --cleanup-tag || true
            done < <(gh release list --repo "$REPO" --json tagName -q '.[].tagName')
          fi

          files=(dist/*)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" "${files[@]}" --clobber
            gh release edit "$TAG" --repo "$REPO" --title "$TITLE" --notes-file "$BODY_FILE" "${prerelease_flags[@]}"
            echo "Release $TAG 已更新"
          else
            gh release create "$TAG" --repo "$REPO" "${files[@]}" \
              --title "$TITLE" --notes-file "$BODY_FILE" "${prerelease_flags[@]}"
            echo "Release $TAG 已创建"
          fi
