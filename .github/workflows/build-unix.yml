name: Build packages

# 手动触发（Actions 页面 Run workflow）或推送 v* tag 时构建；构建完成后自动发布到 Releases：
#   - Windows: 安装版 Setup.exe（向导安装，内置 ffmpeg，离线可用）+ 便携版 .zip（解压即用，内置 ffmpeg），均 x86_64
#   - Linux: AppImage（单文件，赋予执行权限即可运行），按架构拆分 x86_64 / aarch64
#   - macOS: ad-hoc 签名 .app 的 .dmg / .app.zip，按架构拆分 arm64（Apple Silicon）/ x86_64（Intel）
# 每个工件名都带平台/架构后缀，release 阶段统一收集后发布（tag 触发发正式版，手动触发发 continuous 预发布）。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  appimage:
    name: AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install build & runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Build AppImage
        run: python build_linux_appimage.py
      - uses: actions/upload-artifact@v7
        with:
          name: BilibiliDownloader-AppImage-${{ matrix.arch }}
          path: dist/BilibiliDownloader-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  dmg:
    name: DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            # macos-13 已于 2025-12 下线（GitHub 停止维护 Intel runner）；
            # 改用官方提供的最后一个 x86_64 镜像 macos-15-intel（预计可用至 2027-08）。
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install build & runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Build DMG
        run: python build_macos_dmg.py
      - uses: actions/upload-artifact@v7
        with:
          name: BilibiliDownloader-macOS-${{ matrix.arch }}
          path: |
            dist/BilibiliDownloader-macos-${{ matrix.arch }}.dmg
            dist/BilibiliDownloader-macos-${{ matrix.arch }}.app.zip
          if-no-files-found: error

  windows:
    name: Windows exe / portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install build & runtime deps
        # auto-py-to-exe 是 build_portable.py 的打包引擎；
        # win10toast 是 Windows 通知依赖（hidden-import，未进 requirements.txt，需单独装）。
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller auto-py-to-exe win10toast
          pip install -r requirements.txt
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Set version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=continuous" >> "$GITHUB_OUTPUT"
          fi
      # 一键脚本：产出 onedir + 内置 ffmpeg，再编译出安装版 Setup.exe（取代原单文件 .exe）
      - name: Build installer (Setup.exe) with embedded ffmpeg
        run: .\installer\build_installer.ps1 -Version "$env:BD_VERSION"
        env:
          BD_VERSION: ${{ steps.ver.outputs.ver }}
      - name: Zip portable (with embedded ffmpeg)
        run: python -c "import shutil; shutil.make_archive('dist/BilibiliDownloader-portable', 'zip', 'dist', 'BilibiliDownloader')"
      - uses: actions/upload-artifact@v7
        with:
          name: BilibiliDownloader-Windows
          path: |
            dist/BilibiliDownloader-Setup-*.exe
            dist/BilibiliDownloader-portable.zip
          if-no-files-found: error

  # 每次构建完都自动发布到 GitHub Release（永久保留、可直接下载；Actions artifact
  # 90 天会过期）。推送 v* tag 时发正式版（release 名即 tag）；手动触发（workflow_dispatch）
  # 时发滚动的 continuous 预发布，每次覆盖更新同名 release 的资源。
  release:
    name: Publish to GitHub Release
    needs: [appimage, dmg, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine release tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=" >> "$GITHUB_OUTPUT"
            echo "title=BilibiliDownloader ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=continuous" >> "$GITHUB_OUTPUT"
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
            echo "title=BilibiliDownloader 持续构建 ($(date +%Y-%m-%d))" >> "$GITHUB_OUTPUT"
          fi
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: List collected files
        run: ls -lh dist
      # 注意：本 job 不 checkout 源码（无需 .git），因此必须显式用 --repo 指定仓库，
      # 否则 gh 会回退到 git 命令去探测 remote，在无 .git 目录时直接报
      # “failed to run git: fatal: not a git repository”，导致发布失败。
      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          TITLE: ${{ steps.tag.outputs.title }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          notes=$(mktemp)
          {
            echo "## 下载"
            echo
            echo "| 平台 | 架构 | 文件 | 说明 |"
            echo "| --- | --- | --- | --- |"
            echo "| Linux | x86_64 | \`BilibiliDownloader-x86_64.AppImage\` | 单文件，\`chmod +x\` 后运行 |"
            echo "| Linux | ARM64 | \`BilibiliDownloader-aarch64.AppImage\` | 树莓派 / ARM 设备，\`chmod +x\` 后运行 |"
            echo "| macOS | Apple Silicon | \`BilibiliDownloader-macos-arm64.dmg\` | 拖拽到「应用程序」安装 |"
            echo "| macOS | Apple Silicon | \`BilibiliDownloader-macos-arm64.app.zip\` | 已 ad-hoc 签名的 \`.app\` |"
            echo "| macOS | Intel | \`BilibiliDownloader-macos-x86_64.dmg\` | 拖拽到「应用程序」安装 |"
            echo "| macOS | Intel | \`BilibiliDownloader-macos-x86_64.app.zip\` | 已 ad-hoc 签名的 \`.app\` |"
            WIN_SETUP="BilibiliDownloader-Setup-${TAG#v}.exe"
            echo "| Windows | x86_64 | \`$WIN_SETUP\` | 安装版（向导安装，内置 ffmpeg，离线可用）|"
            echo "| Windows | x86_64 | \`BilibiliDownloader-portable.zip\` | 便携版（解压即用，无需安装） |"
            echo
            if [[ -n "$PRERELEASE" ]]; then
              echo "> 本发布为**持续构建（prerelease）**，对应最近一次手动触发的构建，可能不稳定。"
              echo
            fi
            echo "> **macOS 首次打开**：本包未做 Apple 公证，Gatekeeper 会拦截。"
            echo "> 请右键点击 App/DMG 选择「打开」，或在终端执行："
            echo "> \`xattr -d com.apple.quarantine /Applications/BilibiliDownloader.app\`"
            echo
            echo "> Windows 安装版 / 便携版均已**内置 FFmpeg**（无需联网即可下载视频）。"
            echo "> Linux AppImage / macOS 仍会在首次使用时自动按平台下载并缓存 FFmpeg。"
          } > "$notes"
          files=(dist/*)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" "${files[@]}" --clobber
            gh release edit "$TAG" --repo "$REPO" --title "$TITLE" --notes-file "$notes" $PRERELEASE
            echo "Release $TAG 已更新"
          else
            gh release create "$TAG" --repo "$REPO" "${files[@]}" \
              --title "$TITLE" --notes-file "$notes" $PRERELEASE
            echo "Release $TAG 已创建"
          fi
